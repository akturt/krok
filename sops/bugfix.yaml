name: bugfix
version: 1
description: Bug fix — from reproduction to closing the bug report with minimal bureaucracy
triggers:
  - Opened GitHub Issue with label bug
  - PR marked as hotfix

input:
  required:
    - type: github_issue
      label: bug
  optional:
    - type: spec
      path_pattern: docs/specs/drafts/YYYY-MM-DD-bugfix-<slug>.md
      status: draft
      note: "spec is created only if the fix is non-trivial (touches contract, data model, security); otherwise commit message + PR description is sufficient"

output:
  - type: pr
    state: merged
  - type: audit
    final_path: docs/audits/YYYY-MM-DD-bugfix-<slug>.md
    status: completed
    condition: only_for_hotfix_or_security
  - type: github_issue
    state: closed

steps:
  - id: 1
    name: Reproduce
    gate: manual
    produces: "bug reproduced locally or a rationale of «not reproducible»"
    depends_on: []

  - id: 2
    name: Triage — is a spec needed?
    gate: manual
    produces: "decision trivial-fix vs non-trivial. For non-trivial — create a spec in docs/specs/drafts/"
    depends_on: [1]

  - id: 3
    name: Documentation Review (if spec was created)
    role: documentation-reviewer
    platform: any
    produces: "spec with valid Schema v1 FM"
    depends_on: [2]
    condition: "if spec created"

  - id: 4
    name: Fix code
    gate: manual
    produces: "PR with the fix and tests"
    depends_on: [2]

  - id: 5
    name: Tests green
    gate: manual
    produces: "local and CI tests green"
    depends_on: [4]

  - id: 6
    name: Architecture Review (if fix is architecture-sensitive)
    role: architecture-reviewer
    platform: any
    produces: "ACK or ADR if the fix changes topology/model/contract"
    depends_on: [4]
    condition: "if architectural impact"

  - id: 7
    name: Documentation update (if docs are affected)
    gate: manual
    produces: "docs/architecture/, runbook, secrets updated as needed"
    depends_on: [5]

  - id: 8
    name: Audit (only for hotfix/security)
    gate: manual
    platform: any
    produces: "docs/audits/YYYY-MM-DD-bugfix-<slug>.md if the fix is a hotfix or security-related"
    depends_on: [5, 7]
    condition: "if hotfix OR security"

  - id: 9
    name: Merge + close issue
    gate: manual
    produces: "PR merged, Issue closed"
    depends_on: [5, 6, 8]