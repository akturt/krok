name: new-feature
version: 1
description: Adding a new user-facing feature — from spec draft to implemented + audit
triggers:
  - Created .md in docs/specs/drafts/
  - PR adds a new user-facing capability (endpoint, UI flow, CLI command)

input:
  required:
    - type: spec
      path_pattern: docs/specs/drafts/YYYY-MM-DD-<slug>.md
      status: draft
      frontmatter_mandatory: [entity_refs]
  optional:
    - type: adr
      path_pattern: docs/adr/NNN-<slug>.md
      status: proposed

output:
  - type: spec
    final_path: docs/specs/implemented/YYYY-MM-DD-<slug>.md
    status: implemented
  - type: adr
    final_path: docs/adr/NNN-<slug>.md
    status: accepted
  - type: audit
    final_path: docs/audits/YYYY-MM-DD-<slug>.md
    status: completed

steps:
  - id: 1
    name: Architecture Review
    role: architecture-reviewer
    platform: any
    produces: "ADR proposed (or a rationale of «not needed» if the feature is trivial)"
    depends_on: []

  - id: 2
    name: Documentation Review — spec frontmatter
    role: documentation-reviewer
    platform: any
    produces: "spec with valid Schema v1 FM; frontmatter status=draft ready for approval"
    depends_on: []

  - id: 3
    name: Promote spec draft→approved
    gate: manual
    produces: "git mv docs/specs/drafts/<spec>.md → docs/specs/approved/; frontmatter status=approved; Acceptance criteria (AC-NNN) present"
    depends_on: [1, 2]

  - id: 4
    name: Implementation (code + tests)
    gate: manual
    produces: "PR with implementation and green tests"
    depends_on: [3]

  - id: 5
    name: Documentation Review — post-implementation docs update
    role: documentation-reviewer
    platform: any
    produces: "docs/architecture/, docs/adr/, runbook updated if necessary"
    depends_on: [4]

  - id: 6
    name: Promote spec approved→implemented + fill ## Result
    gate: manual
    produces: "git mv → docs/specs/implemented/; frontmatter status=implemented; ## Result filled"
    depends_on: [4, 5]

  - id: 7
    name: Audit — post-implementation review
    gate: manual
    platform: any
    produces: "docs/audits/YYYY-MM-DD-<slug>.md; frontmatter status=completed; body append-only"
    depends_on: [6]