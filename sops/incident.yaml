name: incident
version: 1
description: Production incident — from detection to postmortem and incident audit
triggers:
  - alert fired (PagerDuty / Slack alert)
  - manual escalation from operator
  - customer-visible degradation

input:
  required:
    - type: trigger
      description: "alert source, severity, initial symptoms"
    - type: scope
      description: "affected entities (services, data, users)"

output:
  - type: audit
    final_path: docs/audits/YYYY-MM-DD-incident-<slug>.md
    status: completed
    body_sections: [Summary, Findings (root cause), Resolution, Delta]
  - type: adr
    final_path: docs/adr/NNN-incident-<slug>-followup.md
    status: proposed
    condition: if_architectural_fix_needed
  - type: runbook_update
    note: "if postmortem showed gaps in existing runbooks"

steps:
  - id: 1
    name: Detect + acknowledge
    gate: manual
    produces: "alert ack; severity assigned (P0|P1|P2); on-call engineer identified"
    depends_on: []

  - id: 2
    name: Triage — scope, severity, stakeholders
    gate: manual
    produces: "scope recorded: affected services/users; severity confirmed; stakeholders notified"
    depends_on: [1]

  - id: 3
    name: Mitigate — restore service
    gate: manual
    produces: "service restored (rollback, hotfix, rate-limit, feature flag off) — the main thing is to stop the bleeding"
    depends_on: [2]

  - id: 4
    name: Communicate
    gate: manual
    produces: "stakeholders updated; incident status page updated (if public); internal log updates every 30 min during active"
    depends_on: [3]

  - id: 5
    name: Root cause analysis (post-mitigation)
    gate: manual
    produces: "RCA recorded: what happened, why, which 5 whys led to the root cause"
    depends_on: [3]

  - id: 6
    name: Architecture Review (if root cause is architectural)
    role: architecture-reviewer
    platform: any
    produces: "if root cause is in the architecture — ADR proposed for a structural fix"
    depends_on: [5]
    condition: "if architectural root cause"

  - id: 7
    name: Documentation Review — update affected runbooks
    role: documentation-reviewer
    platform: any
    produces: "affected runbooks (docs/troubleshooting.md, docs/<service>-deploy.md) updated; missing runbook created if gap found"
    depends_on: [5]

  - id: 8
    name: Write incident audit doc
    gate: manual
    produces: "cp docs/.control/documentation/templates/audit.md → docs/audits/YYYY-MM-DD-incident-<slug>.md; fill frontmatter (status=draft, scope=incident, trigger=<alert source>, entity_refs=affected services)"
    depends_on: [5, 6, 7]

  - id: 9
    name: Fill audit body — Summary, Findings (RCA), Resolution (mitigation + followup plan), Delta (what changed compared to the previous incident)
    gate: manual
    produces: "audit body filled per canonical structure"
    depends_on: [8]

  - id: 10
    name: Promote audit draft→completed + freeze body
    gate: manual
    produces: "frontmatter status=completed; body append-only; follow-up actions moved to Issues or specs/drafts/"
    depends_on: [9]

  - id: 11
    name: Follow-up tracking — open GitHub Issues for each follow-up action
    gate: manual
    produces: "Issues created and linked to the audit doc via entity_refs; tracking labels (incident-followup) applied"
    depends_on: [10]