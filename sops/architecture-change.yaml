name: architecture-change
description: Architecture change — from proposal to accepted ADR with docs/architecture/ update
triggers:
  - proposal of a new ADR in docs/adr/
  - PR changes topology (new load balancer, new DB, queue replacement)
  - PR changes data model (new schema, new index type)
  - PR changes security model (RBAC, ACL, authn/authz)

input:
  required:
    - type: adr
      path_pattern: docs/adr/NNN-<slug>.md
      status: proposed
      canonical_body_sections: [Status, Context, Decision, Consequences]

output:
  - type: adr
    final_path: docs/adr/NNN-<slug>.md
    status: accepted
  - type: architecture_doc
    path: docs/architecture/<topic>.md
    status: active
    note: "updated only if topology/data-model/invariants change"
  - type: spec
    note: "optional: if the architectural decision requires an implementation spec"
    final_path: docs/specs/approved/YYYY-MM-DD-<slug>.md
    status: approved

steps:
  - id: 1
    name: Architecture Review — ADR validation
    role: architecture-reviewer
    platform: any
    produces: "ADR canonical form verified; body has 4 sections; status=proposed; supersedes (if any) correctly formatted"
    depends_on: []

  - id: 2
    name: Security Review
    gate: manual
    produces: "confirmation that security model is not violated; marks ADR security-sensitive if so"
    depends_on: [1]
    condition: "if security-impact"

  - id: 3
    name: Acceptance — promote ADR proposed→accepted
    gate: manual
    produces: "frontmatter status=accepted; ADR body remains byte-for-byte unchanged (only FM transition)"
    depends_on: [1, 2]

  - id: 4
    name: Update architecture docs
    gate: manual
    produces: "docs/architecture/README.md Critical Invariants updated; corresponding docs/architecture/<topic>.md updated (not a new version, update of existing)"
    depends_on: [3]
    condition: "if topology or invariants changed"

  - id: 5
    name: Documentation Review — validate affected docs
    role: documentation-reviewer
    platform: any
    produces: "all affected .md are valid per Schema v1; new entity_refs reference existing ids in docs/architecture/"
    depends_on: [4]
    condition: "if docs changed"

  - id: 6
    name: Optional — create implementation spec
    gate: manual
    produces: "optional: docs/specs/drafts/YYYY-MM-DD-<slug>.md (if the architectural decision requires explicit implementation)"
    depends_on: [3, 5]
    condition: "if implementation work needed"

  - id: 7
    name: Audit (if architectural change is high-impact)
    gate: manual
    platform: any
    produces: "docs/audits/YYYY-MM-DD-<slug>.md (status=completed) — post-implementation assessment"
    depends_on: [3]
    condition: "if high-impact change"