name: audit
description: Conducting an audit — from defining scope to an append-only completed audit document
triggers:
  - periodic check (quarterly/monthly)
  - post-incident review
  - pre-release sanity check
  - external auditor request

input:
  required:
     - type: trigger
      description: "one of: periodic / incident / pre-release / external"
    - type: scope
      description: "list of entities (entity_refs) that will be checked"

output:
  - type: audit
    final_path: docs/audits/YYYY-MM-DD-<slug>.md
    status: completed
    body_sections: [Summary, Findings, Conflicts, Resolution, Delta]

steps:
  - id: 1
    name: Define scope and trigger
    gate: manual
    produces: "scope of factors defined, trigger fully recorded in FM field trigger; entity_refs in FM point to the entities being checked"
    depends_on: []

  - id: 2
    name: Copy template to target path
    gate: manual
    produces: "cp docs/.control/documentation/templates/audit.md docs/audits/YYYY-MM-DD-<slug>.md"
    depends_on: [1]

  - id: 3
    name: Fill frontmatter
    gate: manual
    produces: "frontmatter filled: schema=1, id=audit-<slug>, type=audit, status=draft, date, owners, scope, trigger, entity_refs, touches"
    depends_on: [2]

  - id: 4
    name: Conduct audit — gather findings
    gate: manual
    produces: "Findings table (Severity, File, Evidence, Recommendation); Conflicts section if there are contradictions; Delta section — what changed since the last audit"
    depends_on: [3]

  - id: 5
    name: Documentation Review — check canonical form
    role: documentation-reviewer
    platform: any
    produces: "FM correct (Schema v1, audit per-type extension scope/trigger filled in); body follows canonical structure (Summary→Findings→Conflicts→Resolution→Delta)"
    depends_on: [4]

  - id: 6
    name: Architecture Review (if audit is architecture-sensitive)
    role: architecture-reviewer
    platform: any
    produces: "if audit touches ADR or architecture/ — verify that findings are consistent with existing ADRs"
    depends_on: [4]
    condition: "if architecture scope"

  - id: 7
    name: Resolution — plan addressing findings
    gate: manual
    produces: "Resolution section: for each non-trivial finding — assign a follow-up action (issue, ADR, spec, manual fix)"
    depends_on: [4, 5, 6]

  - id: 8
    name: Promote audit draft→completed + freeze body
    gate: manual
    produces: "frontmatter status=completed; body append-only — no longer edited; follow-up actions moved to GitHub Issues or backlog"
    depends_on: [7]