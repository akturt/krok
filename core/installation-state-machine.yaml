states:
  fresh:
    description: Nothing installed
    transitions:
      - action: bootstrap
        target: installed

  installed:
    description: Fully deployed
    transitions:
      - action: manual-edit
        target: broken

  partial:
    description: Some components missing
    transitions:
      - action: bootstrap
        target: installed

  broken:
    description: Integrity compromised
    transitions:
      - action: re-bootstrap
        target: installed
