boundaries:
  description: What is pristine, editable, generated, and secret in consumer repo
  version: 1

  pristine:
    - path: docs/.control/
      reason: "Krok submodule (managed by git submodule update --remote)"
      owner: core
      immutable: true

  editable:
    - path: docs/architecture/
      reason: "architecture documentation (topology, invariants, domain model)"
      owner: consumer
    - path: docs/adr/
      reason: "Architecture Decision Records"
      owner: consumer
    - path: docs/specs/
      reason: "specification documents (drafts, approved, implemented, superseded)"
      owner: consumer
    - path: docs/audits/
      reason: "audit reports and reality checks"
      owner: consumer
    - path: docs/backlog/
      reason: "backlog items"
      owner: consumer
    - path: docs/api/
      reason: "API documentation"
      owner: consumer

  generated:
    - path: .context/project.yml
      reason: "AI agent entry metadata (initial stub, user fills in)"
      generator: bootstrap
    - path: .context/boundaries.yml
      reason: "boundary definitions (initial stub, user fills in)"
      generator: bootstrap
    - path: .context/agent-entry.md
      reason: "agent entry protocol (generated by bootstrap)"
      generator: bootstrap
    - path: CLAUDE.md
      reason: "Krok snippet (prepended by bootstrap)"
      generator: bootstrap
    - path: .github/workflows/docs-validate.yml
      reason: "CI workflow (created by bootstrap)"
      generator: bootstrap

  secret:
    - path: ".env"
      reason: "environment variables (never commit)"
    - path: ".context/secrets.yml"
      reason: "secret configuration (never commit)"
