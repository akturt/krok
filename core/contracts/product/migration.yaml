migration:
  description: One-time transition from the immediately previous version. Not a compatibility layer - after the transition the old form is unsupported.
  version: 2

  transitions:
    - from: "2.0.0"
      to: "3.0.0"
      requires_bootstrap: true
      requires_manual_actions: true
      requires_consumer_changes: true
      breaking: true
      rules:
        - input: "submodule at docs/.runtime/underboss"
          result: "moved to docs/.control; generated files regenerated by bootstrap"
        - input: "docs/specs/review/*"
          result: "moved to docs/specs/drafts/ with status draft; approval is a human act, never automatic"
        - input: "type api with an old lifecycle status"
          result: "draft, review, approved, implemented become active; superseded becomes deprecated; old docs/api/ subdirectories removed"
        - input: "entity_refs, implements, depends_on naming renamed ids"
          result: "rewritten to the new ids, repository-wide, atomically"
        - input: "existing backlog"
          result: "open items to docs/backlog/active.md; done and non-actionable items to docs/backlog/archive.md"
        - input: ".context/boundaries.yml"
          result: "regenerated from the corrected generator"
        - input: "specs in approved/ whose scope is already realized"
          result: "moved to implemented/ by the owner's explicit list"
      script: core/migrate/v2-to-v3.mjs
      idempotent: true
